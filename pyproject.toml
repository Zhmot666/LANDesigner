[project]
name = "lan-designer"
version = "0.1.0"
description = "LAN CAD + CMDB lite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["landesigner*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

