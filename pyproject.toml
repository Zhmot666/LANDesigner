[project]
name = "lan-designer"
version = "0.1.0"
description = "LAN CAD + CMDB lite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
]

[project.optional-dependencies]
remote = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
]
dev = [
  "pytest>=8.0",
  "lan-designer[remote]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["landesigner*", "server*"]

[tool.setuptools.package-data]
landesigner = ["resources/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "postgres: интеграционный тест PostgreSQL (LANDESIGNER_TEST_DATABASE_URL)",
]

